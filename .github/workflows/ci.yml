name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            apps/api/migrations/001_initial_schema.sql apps/api/migrations/002_saas_billing_access.sql \
            apps/api/migrations/005_payment_hardening.sql apps/api/migrations/006_payment_provider_configs.sql \
            apps/api/migrations/007_voucher_hardening.sql apps/api/migrations/008_operational_hardening.sql \
            apps/api/migrations/009_payment_concurrency.sql apps/api/migrations/010_notification_queue_indexes.sql \
            apps/api/migrations/011_payment_event_tenant_isolation.sql apps/api/migrations/012_notification_outbox_hardening.sql \
            apps/api/migrations/013_session_integrity.sql apps/api/migrations/014_traffic_fairness.sql \
            apps/api/migrations/015_traffic_samples.sql apps/api/migrations/016_traffic_enforcement_events.sql \
            apps/api/migrations/017_network_device_management.sql apps/api/migrations/018_network_device_credentials.sql; do
            test -f "$file"
          done
          grep -q "routers_management_protocol_idx" apps/api/migrations/017_network_device_management.sql
          grep -q "UNIFI_NETWORK_API" apps/api/migrations/017_network_device_management.sql
          grep -q "OPENWRT_UBUS" apps/api/migrations/017_network_device_management.sql
          grep -q "CAMBIUM_CNMAESTRO" apps/api/migrations/017_network_device_management.sql
          grep -q "management_credentials_encrypted" apps/api/migrations/018_network_device_credentials.sql
          grep -q "management_credentials_version" apps/api/migrations/018_network_device_credentials.sql
      - name: Lint API
        run: pnpm --filter @jaslyn-net/api lint
      - name: Typecheck API
        run: pnpm --filter @jaslyn-net/api typecheck
      - name: Test API
        run: pnpm --filter @jaslyn-net/api test
      - name: Typecheck Web
        run: pnpm --filter @jaslyn-net/web typecheck
      - name: Build API
        run: pnpm --filter @jaslyn-net/api build
      - name: Build Web
        run: pnpm --filter @jaslyn-net/web build
      - name: Traffic core benchmark
        run: pnpm --filter @jaslyn-net/api benchmark
