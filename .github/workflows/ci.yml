name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jaslyn-net-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail
          for file in apps/api/migrations/*.sql; do test -f "$file"; done
          test -f apps/api/migrations/028_connectivity_incidents.sql
          test -f apps/api/migrations/029_wan_load_balancing.sql
          test -f apps/api/migrations/030_isp_field_operations.sql
          test -f apps/api/migrations/032_jmwifi_customer_access.sql
          test -f apps/api/migrations/033_customer_service_state_history.sql
          test -f apps/api/migrations/034_fiber_line_state_history.sql
          test -f apps/api/migrations/035_legal_acceptances.sql
          test -f apps/api/migrations/036_ipam.sql
          test -f apps/api/migrations/037_radius_aaa.sql
          test -f apps/api/migrations/043_connectivity_correlation.sql
          test -f apps/api/migrations/044_radius_correlation_convergence.sql
          grep -q "correlation_id" apps/api/migrations/043_connectivity_correlation.sql
          grep -q "ALTER TABLE radius_events" apps/api/migrations/044_radius_correlation_convergence.sql
          grep -q "correlation_id TYPE text" apps/api/migrations/044_radius_correlation_convergence.sql
          grep -q "incident_impacts" apps/api/migrations/028_connectivity_incidents.sql
          grep -q "wan_connections" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "load_balance_policies" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "load_balance_events" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "fiber_lines" apps/api/migrations/030_isp_field_operations.sql
          grep -q "customer_access_bindings" apps/api/migrations/032_jmwifi_customer_access.sql
          grep -q "customer_service_state_events" apps/api/migrations/033_customer_service_state_history.sql
          grep -q "fiber_line_events" apps/api/migrations/034_fiber_line_state_history.sql
          grep -q "legal_acceptances" apps/api/migrations/035_legal_acceptances.sql
          grep -q "ipam_pools" apps/api/migrations/036_ipam.sql
          grep -q "ipam_addresses" apps/api/migrations/036_ipam.sql
          grep -q "radius_nas_clients" apps/api/migrations/037_radius_aaa.sql
          grep -q "radius_user_credentials" apps/api/migrations/037_radius_aaa.sql
          grep -q "radius_accounting_events" apps/api/migrations/037_radius_aaa.sql
      - name: Lint API
        run: pnpm --filter @jaslyn-net/api lint
      - name: Typecheck API
        run: pnpm --filter @jaslyn-net/api typecheck
      - name: Test API
        run: pnpm --filter @jaslyn-net/api test
      - name: Typecheck Web
        run: pnpm --filter @jaslyn-net/web typecheck
      - name: Build API
        run: pnpm --filter @jaslyn-net/api build
      - name: Build Web
        run: pnpm --filter @jaslyn-net/web build
      - name: Traffic core benchmark
        run: pnpm --filter @jaslyn-net/api benchmark
