name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, 'feat/**', 'fix/**', 'build**', 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jaslyn-net-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Validate migration files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(apps/api/migrations/*.sql)
          test "${#migrations[@]}" -gt 0
          for file in "${migrations[@]}"; do test -f "$file"; done

          # Numeric migration prefixes (including ordered letter suffixes) must be unique.
          # Letter suffixes resolve historical collisions while preserving execution order.
          awk -F/ '
            {
              name=$NF
              if (name ~ /^[0-9]+[a-z]?_/) {
                split(name, parts, "_")
                prefix=parts[1]
                if (seen[prefix]++) {
                  printf "Duplicate migration prefix %s: %s\n", prefix, name > "/dev/stderr"
                  failed=1
                }
              }
            }
            END { exit failed }
          ' "${migrations[@]}"

          test -f apps/api/migrations/073_financial_procurement_msp_platform.sql
          test -f apps/api/migrations/074_network_experience_capacity_power_sla.sql
          test -f apps/api/migrations/075_event_driven_automation.sql
          test -f apps/api/migrations/076_tenant_usage_quotas.sql
          test -f apps/api/migrations/077_financial_audit_head_guard.sql
          test -f apps/api/migrations/078_fiber_topology_inventory.sql
          test -f apps/api/migrations/079_network_auto_healing.sql
          test -f apps/api/migrations/080_customer_self_service_portal.sql
          grep -Fq 'FOREIGN KEY (tenant_id, router_id)' apps/api/migrations/078_fiber_topology_inventory.sql
          grep -Fq 'network_auto_heal_runs' apps/api/migrations/079_network_auto_healing.sql
          grep -Fq 'customer_portal_sessions' apps/api/migrations/080_customer_self_service_portal.sql
          grep -Fq "c.command_type = 'BANDWIDTH_ENFORCEMENT'" apps/api/src/network-auto-healing/network-auto-healing.service.ts
          grep -Fq 'customerPortal:CustomerPortalRequest' apps/api/src/customer-portal/customer-portal.guard.ts
          grep -Fq '/^\d+[a-z]?_.+\.sql$/' apps/api/src/database/migrate.ts
          test -f apps/api/migrations/062_session_audit_security_integrity.sql
          test -f apps/api/migrations/063_field_operations_offline_sync.sql
          test -f apps/api/migrations/064_incident_timeline_maintenance_status.sql
          test -f apps/api/migrations/065_network_change_intelligence.sql
          test -f apps/api/migrations/066_network_policy_compliance.sql
          test -f apps/api/migrations/067_synthetic_monitoring.sql
          test -f apps/api/migrations/068_revenue_assurance_reconciliation.sql
          test -f apps/api/migrations/069_tenant_secrets_vault.sql
          test -f apps/api/migrations/070_fine_grained_permissions.sql
          test -f apps/api/migrations/028_connectivity_incidents.sql
          test -f apps/api/migrations/029_wan_load_balancing.sql
          test -f apps/api/migrations/030_isp_field_operations.sql
          test -f apps/api/migrations/032_jmwifi_customer_access.sql
          test -f apps/api/migrations/033_customer_service_state_history.sql
          test -f apps/api/migrations/034_fiber_line_state_history.sql
          test -f apps/api/migrations/035_legal_acceptances.sql
          test -f apps/api/migrations/036_ipam.sql
          test -f apps/api/migrations/037_radius_aaa.sql
          test -f apps/api/migrations/043_connectivity_correlation.sql
          test -f apps/api/migrations/044a_radius_correlation_convergence.sql
          grep -q "correlation_id" apps/api/migrations/043_connectivity_correlation.sql
          grep -q "ALTER TABLE radius_events" apps/api/migrations/044a_radius_correlation_convergence.sql
          grep -q "correlation_id TYPE text" apps/api/migrations/044a_radius_correlation_convergence.sql
          grep -Fq 'DO $$' apps/api/migrations/075_event_driven_automation.sql
          grep -q "incident_impacts" apps/api/migrations/028_connectivity_incidents.sql
          grep -q "wan_connections" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "load_balance_policies" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "load_balance_events" apps/api/migrations/029_wan_load_balancing.sql
          grep -q "fiber_lines" apps/api/migrations/030_isp_field_operations.sql
          grep -q "customer_access_bindings" apps/api/migrations/032_jmwifi_customer_access.sql
          grep -q "customer_service_state_events" apps/api/migrations/033_customer_service_state_history.sql
          grep -q "fiber_line_events" apps/api/migrations/034_fiber_line_state_history.sql
          grep -q "legal_acceptances" apps/api/migrations/035_legal_acceptances.sql
          grep -q "ipam_pools" apps/api/migrations/036_ipam.sql
          grep -q "ipam_addresses" apps/api/migrations/036_ipam.sql
          grep -q "radius_nas_clients" apps/api/migrations/037_radius_aaa.sql
          grep -q "radius_user_credentials" apps/api/migrations/037_radius_aaa.sql
          grep -q "radius_accounting_events" apps/api/migrations/037_radius_aaa.sql
      - name: Lint API
        run: pnpm --filter @jaslyn-net/api lint
      - name: Typecheck API
        run: pnpm --filter @jaslyn-net/api typecheck
      - name: Test API
        run: pnpm --filter @jaslyn-net/api test
      - name: Typecheck Web
        run: pnpm --filter @jaslyn-net/web typecheck
      - name: Build API
        run: pnpm --filter @jaslyn-net/api build
      - name: Build Web
        run: pnpm --filter @jaslyn-net/web build
      - name: Traffic core benchmark
        run: pnpm --filter @jaslyn-net/api benchmark

  migration-smoke:
    name: Fresh install, upgrade and restore rollback on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jaslyn
          POSTGRES_PASSWORD: jaslyn_test_password
          POSTGRES_DB: jaslyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaslyn -d jaslyn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Fresh install all migrations
        env:
          PGPASSWORD: jaslyn_test_password
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/api/migrations/*.sql)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            echo "::group::Fresh install: $file"
            psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_test --set=ON_ERROR_STOP=1 --file="$file"
            echo "::endgroup::"
          done
          psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_test --set=ON_ERROR_STOP=1 --command="SELECT count(*) > 0 AS fresh_install_has_tables FROM information_schema.tables WHERE table_schema='public';" | grep -q t
      - name: Upgrade baseline and test restore-based rollback
        env:
          PGPASSWORD: jaslyn_test_password
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(apps/api/migrations/*.sql)
          createdb --host=127.0.0.1 --port=5432 --username=jaslyn jaslyn_upgrade
          createdb --host=127.0.0.1 --port=5432 --username=jaslyn jaslyn_rollback
          for file in "${files[@]}"; do
            name="${file##*/}"
            prefix="${name%%_*}"
            numeric_prefix="${prefix%%[!0-9]*}"
            if [[ "$numeric_prefix" =~ ^[0-9]+$ ]] && (( 10#$numeric_prefix <= 72 )); then
              echo "::group::Upgrade baseline: $file"
              psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_upgrade --set=ON_ERROR_STOP=1 --file="$file"
              echo "::endgroup::"
            fi
          done
          pg_dump --host=127.0.0.1 --port=5432 --username=jaslyn --format=custom --no-owner --no-privileges --dbname=jaslyn_upgrade --file=/tmp/jaslyn-baseline.dump
          for file in "${files[@]}"; do
            name="${file##*/}"
            prefix="${name%%_*}"
            numeric_prefix="${prefix%%[!0-9]*}"
            if [[ "$numeric_prefix" =~ ^[0-9]+$ ]] && (( 10#$numeric_prefix > 72 )); then
              echo "::group::Apply upgrade: $file"
              psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_upgrade --set=ON_ERROR_STOP=1 --file="$file"
              echo "::endgroup::"
            fi
          done
          for table in suppliers purchase_orders inventory_items inventory_stock_movements tenant_usage_counters financial_audit_chain_heads; do
            psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_upgrade --set=ON_ERROR_STOP=1 --command="SELECT to_regclass('public.$table') IS NOT NULL;" | grep -q t
          done
          pg_restore --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_rollback --no-owner --no-privileges /tmp/jaslyn-baseline.dump
          psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_rollback --set=ON_ERROR_STOP=1 --command="SELECT to_regclass('public.tenants') IS NOT NULL;" | grep -q t
          for table in suppliers purchase_orders inventory_items inventory_stock_movements tenant_usage_counters financial_audit_chain_heads; do
            psql --host=127.0.0.1 --port=5432 --username=jaslyn --dbname=jaslyn_rollback --set=ON_ERROR_STOP=1 --command="SELECT to_regclass('public.$table') IS NULL;" | grep -q t
          done
