name: Secret Scan

on:
  push:
    branches: ["main", "**"]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Detect committed secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history
        uses: zricethezav/gitleaks:latest
        with:
          args: detect --source=. --redact --no-banner
