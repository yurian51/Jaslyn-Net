services:
  - type: web
    name: jaslyn-net-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @jaslyn-net/api build
    startCommand: pnpm --filter @jaslyn-net/api migrate && pnpm --filter @jaslyn-net/api start
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NODE_ENV
        value: "production"
      # Render terminates TLS at one proxy hop; without this request.ip is the proxy for every client,
      # which breaks per-client rate limits (sign-in throttle, portal voucher limiter) and session IP audit.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: CORS_ORIGIN
        fromService:
          name: jaslyn-net-production
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: jaslyn-net-db
          property: connectionString
      - key: DATABASE_SSL
        value: "require"
      - key: JWT_SECRET
        generateValue: true
      - key: JASLYN_NETWORK_CREDENTIAL_KEY
        generateValue: true

  - type: web
    name: jaslyn-net-production
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter @jaslyn-net/web build
    startCommand: pnpm --filter @jaslyn-net/web start
    envVars:
      - key: NODE_VERSION
        value: "24.21.0"
      - key: NEXT_PUBLIC_API_URL
        value: "https://jaslyn-net-api-18o7.onrender.com/api/v1"

databases:
  - name: jaslyn-net-db
    plan: free
    region: oregon
    postgresMajorVersion: 18
